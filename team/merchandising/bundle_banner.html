<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>번들 기획전 배너 — Olist</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 400px; overflow: hidden; background: #f5f0e8; }
.banner {
  width: 1200px; height: 400px; position: relative; overflow: hidden;
  font-family: Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  background: #f5f0e8;
}
.left-panel { position: absolute; top: 0; left: 0; width: 560px; height: 400px; background: linear-gradient(110deg, #f7f2e8 0%, #ede8dc 100%); }
.right-panel { position: absolute; top: 0; right: 0; width: 720px; height: 400px; background: linear-gradient(135deg, #7cb87a 0%, #5a9e57 40%, #4a8f47 100%); clip-path: polygon(80px 0, 100% 0, 100% 100%, 0 100%); }
.top-nav { position: absolute; top: 0; left: 0; right: 0; height: 42px; z-index: 20; display: flex; align-items: center; padding: 0 28px; background: rgba(255,255,255,0.92); border-bottom: 1px solid rgba(0,0,0,0.08); }
.nav-logo { font-size: 17px; font-weight: 900; color: #1a1a1a; letter-spacing: -0.5px; margin-right: 32px; flex-shrink: 0; }
.nav-logo .acc { color: #4a8f47; }
.nav-tab { height: 42px; display: flex; align-items: center; padding: 0 14px; font-size: 12.5px; font-weight: 700; color: #555; border-bottom: 2px solid transparent; white-space: nowrap; }
.nav-tab.on { color: #4a8f47; border-bottom-color: #4a8f47; font-weight: 800; }
.left-content { position: absolute; top: 42px; left: 0; width: 490px; bottom: 0; z-index: 10; display: flex; flex-direction: column; justify-content: center; padding: 0 0 0 52px; }
.event-label { font-size: 12px; font-weight: 900; color: #4a8f47; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.event-label::before { content: ''; display: inline-block; width: 22px; height: 2px; background: #4a8f47; }
.headline { font-size: 42px; font-weight: 900; color: #1a1a1a; line-height: 1.15; letter-spacing: -1.5px; margin-bottom: 14px; }
.headline em { color: #4a8f47; font-style: normal; }
.sub-text { font-size: 14px; color: #666; font-weight: 600; margin-bottom: 22px; line-height: 1.5; }
.cta-row { display: flex; align-items: center; gap: 12px; }
.cta-btn { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 20px; background: #1a1a1a; color: #fff; font-size: 13px; font-weight: 800; border-radius: 4px; cursor: pointer; }
.cta-secondary { font-size: 12.5px; color: #888; font-weight: 600; display: flex; align-items: center; gap: 4px; }
.cta-secondary::after { content: '›'; font-size: 16px; color: #aaa; }
.right-content { position: absolute; top: 42px; right: 0; width: 660px; bottom: 36px; z-index: 10; display: flex; align-items: center; justify-content: center; padding-right: 40px; }
.product-img { height: 310px; width: auto; max-width: 560px; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.18)); }
.discount-badge { position: absolute; top: 56px; right: 44px; z-index: 15; width: 72px; height: 72px; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(0,0,0,0.15); text-align: center; }
.badge-pct { font-size: 22px; font-weight: 900; color: #e94560; line-height: 1; }
.badge-label { font-size: 9px; font-weight: 800; color: #666; letter-spacing: 0.5px; }
.slide-indicator { position: absolute; bottom: 46px; left: 52px; z-index: 15; display: flex; align-items: center; gap: 8px; }
.ind-btn { width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; font-size: 11px; color: #444; }
.ind-count { font-size: 12px; color: #888; font-weight: 700; }
.bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 36px; z-index: 20; display: flex; align-items: center; justify-content: center; gap: 24px; background: rgba(255,255,255,0.88); border-top: 1px solid rgba(0,0,0,0.07); }
.bar-item { font-size: 12px; color: #555; display: flex; align-items: center; gap: 5px; font-weight: 700; }
.bar-item strong { color: #4a8f47; }
.bar-sep { width: 1px; height: 12px; background: #ddd; }
</style>
</head>
<body>
<div class="banner">
  <div class="left-panel"></div>
  <div class="right-panel"></div>
  <div class="top-nav">
    <div class="nav-logo">o<span class="acc">list</span></div>
    <div class="nav-tab on">기획전</div>
    <div class="nav-tab">랭킹</div>
    <div class="nav-tab">세일</div>
    <div class="nav-tab">신상품</div>
    <div class="nav-tab">멤버십/쿠폰</div>
    <div class="nav-tab">이벤트</div>
  </div>
  <div class="left-content">
    <div class="event-label">번들 기획전 PICK</div>
    <div class="headline">함께 사면<br>더 <em>15% 할인</em><br>번들 세트</div>
    <div class="sub-text">2개 구매 시 추가 할인 + 무료 배송<br>11.24 – 11.30 한정</div>
    <div class="cta-row">
      <div class="cta-btn">🛒 번들 쿠폰 받기</div>
      <div class="cta-secondary">상품 보러가기</div>
    </div>
  </div>
  <div class="right-content">
    <img class="product-img" src="../발표자료/TF3-재구매/assets/tf3-bundle-bedding-set.png" alt="번들 침구 세트">
  </div>
  <div class="discount-badge">
    <div class="badge-pct">15%</div>
    <div class="badge-label">번들 할인</div>
  </div>
  <div class="slide-indicator">
    <div class="ind-btn">‹</div>
    <div class="ind-count">1 / 5</div>
    <div class="ind-btn">›</div>
  </div>
  <div class="bottom-bar">
    <div class="bar-item">📦 2개 구매 시 <strong>15% 할인</strong></div>
    <div class="bar-sep"></div>
    <div class="bar-item">🚚 <strong>무료 배송</strong> 포함</div>
    <div class="bar-sep"></div>
    <div class="bar-item">⏰ 기간 한정 <strong>11.24 – 11.30</strong></div>
    <div class="bar-sep"></div>
    <div class="bar-item">✨ 번들 합계 <strong>₩40,000 이상</strong> 적용</div>
  </div>
</div>
</body>
</html>
