<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>블랙프라이데이 번들 기획전 — Olist</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1200px;
  height: 400px;
  overflow: hidden;
  background: #111;
}

.banner {
  width: 1200px;
  height: 400px;
  position: relative;
  overflow: hidden;
  background: #111;
  font-family: 'Arial Black', Arial, 'Helvetica Neue', sans-serif;
}

/* ── 배경 레이어 ── */
.bg {
  position: absolute;
  inset: 0;
  /* 레퍼런스: 군중 실루엣처럼 어두운 그라디언트 */
  background:
    radial-gradient(ellipse 70% 90% at 50% 100%, rgba(20,20,20,0.95) 0%, transparent 60%),
    radial-gradient(ellipse 40% 50% at 15% 60%, rgba(0,180,80,0.06) 0%, transparent 55%),
    radial-gradient(ellipse 50% 60% at 80% 40%, rgba(0,180,80,0.04) 0%, transparent 55%),
    linear-gradient(165deg, #1a1a1a 0%, #0d0d0d 40%, #151515 100%);
}

/* 군중 실루엣 느낌 (하단 어두운 형태들) */
.crowd {
  position: absolute;
  bottom: 36px;
  left: 0;
  right: 0;
  height: 90px;
  pointer-events: none;
  overflow: hidden;
}
.crowd::before {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50px;
  width: 60px; height: 70px;
  background: rgba(0,0,0,0.55);
  border-radius: 50% 50% 0 0;
}
.crowd::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 130px;
  width: 45px; height: 55px;
  background: rgba(0,0,0,0.45);
  border-radius: 50% 50% 0 0;
}

/* ── 상단 로고 + 탭 ── */
.top-nav {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 44px;
  z-index: 10;
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 0;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  background: rgba(0,0,0,0.4);
}

.nav-brand {
  display: flex;
  flex-direction: column;
  margin-right: 30px;
  flex-shrink: 0;
}
.nav-brand-top {
  font-size: 8px;
  font-weight: 900;
  color: rgba(255,255,255,0.5);
  letter-spacing: 3px;
  text-transform: uppercase;
  line-height: 1;
}
.nav-brand-main {
  font-size: 14px;
  font-weight: 900;
  color: #fff;
  line-height: 1.1;
  letter-spacing: 0.5px;
}
.nav-brand-main .acc { color: #3ddf6e; }

.nav-tab {
  height: 44px;
  display: flex;
  align-items: center;
  padding: 0 18px;
  font-size: 12px;
  font-weight: 800;
  color: rgba(255,255,255,0.45);
  border-bottom: 3px solid transparent;
  border-left: 1px solid rgba(255,255,255,0.07);
  white-space: nowrap;
  cursor: pointer;
  letter-spacing: 0.2px;
}
.nav-tab.on {
  color: #3ddf6e;
  border-bottom-color: #3ddf6e;
}

/* ── 메인 영역 ── */
.main {
  position: absolute;
  top: 44px; left: 0; right: 0; bottom: 38px;
  display: flex;
  align-items: center;
}

/* 좌측: 대형 숫자 "15" — 레퍼런스의 "50"과 동일한 방식 */
.num-area {
  position: relative;
  z-index: 5;
  padding-left: 52px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  flex-shrink: 0;
  width: 380px;
}

.up-to {
  font-size: 15px;
  font-weight: 900;
  color: #3ddf6e;
  letter-spacing: 5px;
  text-transform: uppercase;
  line-height: 1;
  margin-bottom: -6px;
}

.big-num {
  font-size: 260px;
  font-weight: 900;
  color: #3ddf6e;
  line-height: 0.82;
  letter-spacing: -16px;
  /* 레퍼런스의 강렬한 네온 발광 */
  text-shadow:
    0 0 30px rgba(61,223,110,0.4),
    0 0 80px rgba(61,223,110,0.2),
    0 0 160px rgba(61,223,110,0.08);
  display: block;
}

/* ── 원형 — 레퍼런스의 그린 서클 ── */
.circle-area {
  position: absolute;
  /* 숫자 우측에 겹치도록 배치 — 레퍼런스처럼 */
  right: 220px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 6;
}

.circle {
  width: 244px;
  height: 244px;
  background: #3ddf6e;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 18px;
  /* 레퍼런스의 녹색 원 발광 */
  box-shadow:
    0 0 0 14px rgba(61,223,110,0.1),
    0 0 50px rgba(61,223,110,0.35),
    0 0 120px rgba(61,223,110,0.15);
}

.circle-sub {
  font-size: 10.5px;
  font-weight: 900;
  color: rgba(0,0,0,0.6);
  letter-spacing: 2.5px;
  text-transform: uppercase;
  line-height: 1;
  margin-bottom: 7px;
}

.circle-kr {
  font-size: 40px;
  font-weight: 900;
  color: #000;
  line-height: 0.95;
  letter-spacing: -1px;
}

.circle-en {
  font-size: 12.5px;
  font-weight: 900;
  color: rgba(0,0,0,0.5);
  letter-spacing: 2.5px;
  text-transform: uppercase;
  margin-top: 6px;
  line-height: 1;
}

/* % 기호 — 원형 우측 바깥 */
.pct {
  position: absolute;
  right: 36px;
  top: 50%;
  transform: translateY(-30%);
  z-index: 5;
  font-size: 88px;
  font-weight: 900;
  color: #3ddf6e;
  line-height: 1;
  text-shadow:
    0 0 30px rgba(61,223,110,0.4),
    0 0 80px rgba(61,223,110,0.15);
}

/* ── 하단 바 ── */
.bottom-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 38px;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  background: rgba(0,0,0,0.5);
  border-top: 1px solid rgba(255,255,255,0.06);
}

.bottom-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
}

.bottom-main {
  font-size: 13px;
  font-weight: 800;
  color: rgba(255,255,255,0.9);
  letter-spacing: 0.3px;
  line-height: 1;
}

.bottom-date {
  font-size: 11.5px;
  font-weight: 900;
  color: rgba(255,255,255,0.75);
  letter-spacing: 1px;
  line-height: 1;
}

/* 하단 좌·우 보조 */
.bottom-left {
  position: absolute;
  left: 28px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.bottom-right {
  position: absolute;
  right: 28px;
  font-size: 11px;
  font-weight: 800;
  color: rgba(255,255,255,0.35);
  letter-spacing: 1px;
}

.btag {
  font-size: 11.5px;
  color: rgba(255,255,255,0.55);
  display: flex;
  align-items: center;
  gap: 5px;
}
.btag strong { color: #3ddf6e; font-weight: 800; }
.bdot { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.18); }
</style>
</head>
<body>
<div class="banner">

  <div class="bg"></div>
  <div class="crowd"></div>

  <!-- 상단 탭 네비게이션 — 레퍼런스 구조 그대로 -->
  <div class="top-nav">
    <div class="nav-brand">
      <span class="nav-brand-top">olist</span>
      <span class="nav-brand-main">블랙<span class="acc">프라이데이</span></span>
    </div>
    <div class="nav-tab on">투데이번들세일</div>
    <div class="nav-tab">브랜드번들세일</div>
    <div class="nav-tab">카테고리기획전</div>
  </div>

  <!-- 메인 -->
  <div class="main">

    <!-- 좌: 대형 숫자 -->
    <div class="num-area">
      <span class="up-to">UP TO</span>
      <span class="big-num">15</span>
    </div>

    <!-- 중-우: 원형 뱃지 -->
    <div class="circle-area">
      <div class="circle">
        <span class="circle-sub">블랙프라이데이</span>
        <span class="circle-kr">번들</span>
        <span class="circle-kr">기획전</span>
        <span class="circle-en">BUNDLE SALE</span>
      </div>
    </div>

    <!-- 우: % 기호 -->
    <span class="pct">%</span>

  </div>

  <!-- 하단 바 — 레퍼런스의 날짜 + 설명 텍스트 -->
  <div class="bottom-bar">
    <div class="bottom-left">
      <div class="btag">🛒 번들 합계 <strong>₩40,000 이상</strong></div>
      <div class="bdot"></div>
      <div class="btag"><strong>15% 할인</strong> + 무료 배송</div>
    </div>
    <div class="bottom-center">
      <div class="bottom-main">상품으로 만나는 진짜 번들 세일</div>
      <div class="bottom-date">11.24 — 11.30</div>
    </div>
    <div class="bottom-right">olist ©</div>
  </div>

</div>
</body>
</html>
